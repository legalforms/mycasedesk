<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Docket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2740;
    --ink-soft:#3b4763;
    --paper:#eceef3;
    --paper-card:#f7f8fb;
    --rule:#c9cddb;
    --brass:#a9803f;
    --brass-soft:#e7d9bd;
    --maroon:#7a2e2e;
    --maroon-soft:#f3e3e0;
    --green:#3f6b4f;
    --green-soft:#e2ecE4;
    --font-display:'Source Serif 4', serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    padding:32px 20px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header.masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:12px;
  }
  header.masthead .title-block h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    margin:0;
    letter-spacing:0.3px;
  }
  header.masthead .title-block .sub{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  header.masthead .today{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .rule-note{
    font-size:11px;
    color:var(--ink-soft);
    font-family:var(--font-mono);
    margin-bottom:28px;
    letter-spacing:0.5px;
  }

  .panel{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:var(--font-display);
    font-size:18px;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel h2 .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;height:22px;
    border:1px solid var(--brass);
    color:var(--brass);
    font-family:var(--font-mono);
    font-size:11px;
    border-radius:50%;
  }

  form.entry-form{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px 16px;
  }
  form.entry-form .field{display:flex;flex-direction:column;gap:5px;}
  form.entry-form .field.span2{grid-column:span 2;}
  form.entry-form .field.span4{grid-column:span 4;}
  label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    font-family:var(--font-mono);
  }
  input, textarea{
    font-family:var(--font-body);
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--rule);
    border-radius:2px;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:38px;}
  input:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}

  .btn{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:10px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    border-radius:2px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:0.85;}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--rule);
  }
  .btn.brass{
    background:var(--brass);
    border-color:var(--brass);
  }
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .form-actions{
    grid-column:span 4;
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:4px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:14px;
  }
  .toolbar .filter{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .toolbar .filter label{margin:0;}
  .toolbar .filter input[type=date]{padding:7px 9px;font-size:13px;}
  .toolbar .count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    border-bottom:2px solid var(--ink);
    padding:8px 10px;
  }
  tbody td{
    padding:10px 10px;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  tbody tr:hover{background:rgba(169,128,63,0.06);}
  .case-num{font-family:var(--font-mono);font-weight:500;}
  .versus{font-style:italic;color:var(--ink-soft);}
  .badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10.5px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.soon{background:var(--maroon-soft);color:var(--maroon);}
  .badge.later{background:var(--green-soft);color:var(--green);}
  .row-actions{display:flex;gap:8px;}
  .row-actions button{
    font-family:var(--font-mono);
    font-size:11px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .row-actions button:hover{color:var(--maroon);}

  .empty{
    text-align:center;
    padding:40px 10px;
    color:var(--ink-soft);
    font-family:var(--font-mono);
    font-size:12.5px;
  }

  .status-msg{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--green);
    min-height:16px;
    margin-top:8px;
  }
  .status-msg.error{color:var(--maroon);}

  @media (max-width:720px){
    form.entry-form{grid-template-columns:repeat(2,1fr);}
    form.entry-form .field.span2, form.entry-form .field.span4{grid-column:span 2;}
    .form-actions{grid-column:span 2;}
    table, thead, tbody, tr, td, th{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:2px solid var(--ink);padding:10px 0;}
    tbody td{border:none;padding:4px 0;}
    tbody td::before{
      content:attr(data-label);
      font-family:var(--font-mono);
      font-size:10px;
      text-transform:uppercase;
      color:var(--ink-soft);
      display:block;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="title-block">
      <h1>Case Docket</h1>
      <div class="sub">Cause List &amp; Hearing Register</div>
    </div>
    <div class="today" id="todayLabel"></div>
  </header>
  <div class="rule-note">Personal record — stored to this device's account only.</div>

  <section class="panel">
    <h2><span class="num">1</span> New Entry</h2>
    <form class="entry-form" id="entryForm">
      <div class="field">
        <label for="f_date">Date</label>
        <input type="date" id="f_date" required>
      </div>
      <div class="field">
        <label for="f_caseNumber">Case Number</label>
        <input type="text" id="f_caseNumber" placeholder="e.g. CC/1123/2026" required>
      </div>
      <div class="field span2">
        <label for="f_versus">Versus</label>
        <input type="text" id="f_versus" placeholder="e.g. State of AP v. R. Kumar" required>
      </div>

      <div class="field span4">
        <label for="f_details">Case Details</label>
        <textarea id="f_details" placeholder="Brief particulars of the matter"></textarea>
      </div>

      <div class="field span2">
        <label for="f_purpose">Next Purpose</label>
        <input type="text" id="f_purpose" placeholder="e.g. Arguments, Evidence, Bail hearing">
      </div>
      <div class="field">
        <label for="f_nextDate">Next Hearing Date</label>
        <input type="date" id="f_nextDate" required>
      </div>
      <div class="field">
        <label for="f_court">Name of Court</label>
        <input type="text" id="f_court" placeholder="e.g. IV Addl. District Judge" required>
      </div>

      <div class="form-actions">
        <span class="status-msg" id="formStatus"></span>
        <button type="button" class="btn secondary" id="cancelEdit" style="display:none;">Cancel edit</button>
        <button type="submit" class="btn brass" id="submitBtn">Add case</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2><span class="num">2</span> Register</h2>
    <div class="toolbar">
      <div class="filter">
        <label for="dateFilter">Next hearing on</label>
        <input type="date" id="dateFilter">
        <button class="btn secondary" id="clearFilter">Clear</button>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="count" id="rowCount"></span>
        <button class="btn" id="exportAllBtn">Export all (.xlsx)</button>
      </div>
    </div>
    <div id="tableHolder">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Case No.</th>
            <th>Versus</th>
            <th>Next Purpose</th>
            <th>Next Hearing</th>
            <th>Court</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">No cases entered yet. Add your first case above.</div>
    </div>
  </section>

</div>

<script>
let cases = [];
let editingId = null;

const $ = (id) => document.getElementById(id);

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
}

function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso + 'T00:00:00');
  return Math.round((d - today) / 86400000);
}

async function loadCases(){
  try{
    const result = await window.storage.get('cases', false);
    cases = result ? JSON.parse(result.value) : [];
  }catch(e){
    cases = [];
  }
  render();
}

async function saveCases(){
  try{
    await window.storage.set('cases', JSON.stringify(cases), false);
  }catch(e){
    setStatus('formStatus', 'Could not save — try again.', true);
  }
}

function setStatus(id, msg, isError){
  const el = $(id);
  el.textContent = msg;
  el.className = 'status-msg' + (isError ? ' error' : '');
  if(msg){
    setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 3000);
  }
}

function resetForm(){
  $('entryForm').reset();
  editingId = null;
  $('submitBtn').textContent = 'Add case';
  $('cancelEdit').style.display = 'none';
}

$('entryForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const entry = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    date: $('f_date').value,
    caseNumber: $('f_caseNumber').value.trim(),
    versus: $('f_versus').value.trim(),
    details: $('f_details').value.trim(),
    purpose: $('f_purpose').value.trim(),
    nextDate: $('f_nextDate').value,
    court: $('f_court').value.trim(),
  };

  if(editingId){
    cases = cases.map(c => c.id === editingId ? entry : c);
    setStatus('formStatus', 'Entry updated.');
  }else{
    cases.push(entry);
    setStatus('formStatus', 'Case added.');
  }
  await saveCases();
  resetForm();
  render();
});

$('cancelEdit').addEventListener('click', resetForm);

function editCase(id){
  const c = cases.find(x=>x.id===id);
  if(!c) return;
  $('f_date').value = c.date;
  $('f_caseNumber').value = c.caseNumber;
  $('f_versus').value = c.versus;
  $('f_details').value = c.details;
  $('f_purpose').value = c.purpose;
  $('f_nextDate').value = c.nextDate;
  $('f_court').value = c.court;
  editingId = id;
  $('submitBtn').textContent = 'Save changes';
  $('cancelEdit').style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteCase(id){
  cases = cases.filter(c=>c.id!==id);
  await saveCases();
  render();
}

function render(){
  const filterVal = $('dateFilter').value;
  const rows = filterVal ? cases.filter(c=>c.nextDate===filterVal) : cases.slice();
  rows.sort((a,b)=> (a.nextDate||'').localeCompare(b.nextDate||''));

  $('rowCount').textContent = rows.length + (rows.length===1 ? ' case' : ' cases');

  const tbody = $('tbody');
  tbody.innerHTML = '';
  $('emptyState').style.display = rows.length ? 'none' : 'block';

  rows.forEach(c=>{
    const tr = document.createElement('tr');
    const du = c.nextDate ? daysUntil(c.nextDate) : null;
    const badgeClass = (du!==null && du<=7) ? 'soon' : 'later';
    tr.innerHTML = `
      <td data-label="Date">${fmtDate(c.date)}</td>
      <td data-label="Case No." class="case-num">${escapeHtml(c.caseNumber)}</td>
      <td data-label="Versus" class="versus">${escapeHtml(c.versus)}</td>
      <td data-label="Next Purpose">${escapeHtml(c.purpose)}</td>
      <td data-label="Next Hearing"><span class="badge ${badgeClass}">${fmtDate(c.nextDate)}</span></td>
      <td data-label="Court">${escapeHtml(c.court)}</td>
      <td data-label="">
        <div class="row-actions">
          <button data-act="edit" data-id="${c.id}">Edit</button>
          <button data-act="del" data-id="${c.id}">Delete</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

$('tbody').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = btn.dataset.id;
  if(btn.dataset.act === 'edit') editCase(id);
  if(btn.dataset.act === 'del'){
    if(confirm('Delete this case entry?')) deleteCase(id);
  }
});

function exportRows(rows, filenamePart){
  if(!rows.length){
    setStatus('formStatus', 'Nothing to export for that date.', true);
    return;
  }
  const sheetData = rows.map(c=>({
    'Date': fmtDate(c.date),
    'Case Details': c.details,
    'Case Number': c.caseNumber,
    'Versus': c.versus,
    'Next Purpose': c.purpose,
    'Next Hearing Date': fmtDate(c.nextDate),
    'Name of Court': c.court,
  }));
  const ws = XLSX.utils.json_to_sheet(sheetData);
  ws['!cols'] = [{wch:12},{wch:34},{wch:16},{wch:26},{wch:20},{wch:16},{wch:24}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cases');
  XLSX.writeFile(wb, `case-docket_${filenamePart}.xlsx`);
}

$('dateFilter').addEventListener('change', ()=>{
  render();
  const val = $('dateFilter').value;
  if(val){
    const rows = cases.filter(c=>c.nextDate===val);
    exportRows(rows, val);
  }
});

$('clearFilter').addEventListener('click', ()=>{
  $('dateFilter').value = '';
  render();
});

$('exportAllBtn').addEventListener('click', ()=>{
  exportRows(cases, 'all_' + new Date().toISOString().slice(0,10));
});

loadCases();
</script>
</body>
</html>
